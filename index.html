<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Live Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            color: #e0e0e0;
        }

        .player-container {
            width: 90%;
            max-width: 900px;
            background: #111;
            border: 3px solid #333;
            border-radius: 12px;
            box-shadow:
                0 0 40px rgba(0, 0, 0, 0.8),
                inset 0 0 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .player-header {
            background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a2a;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 12px;
            height: 12px;
            background: #ff4444;
            border-radius: 50%;
            animation: pulse 1s ease-in-out infinite;
            box-shadow: 0 0 8px #ff4444;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 8px #ff4444, 0 0 12px #ff2222;
            }
            50% {
                opacity: 0.6;
                box-shadow: 0 0 4px #ff4444;
            }
        }

        .live-text {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ff4444;
            text-shadow: 0 0 4px rgba(255, 68, 68, 0.5);
        }

        .viewer-count {
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
        }

        .player-video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .video-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .player-controls {
            background: linear-gradient(180deg, #0f0f0f 0%, #1a1a1a 100%);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #2a2a2a;
        }

        .control-button {
            width: 36px;
            height: 36px;
            background: #222;
            border: 1px solid #333;
            border-radius: 4px;
            color: #666;
            cursor: default;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .control-button:hover {
            opacity: 0.5;
        }

        .progress-bar {
            flex: 1;
            height: 3px;
            background: #333;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #666, #888);
            border-radius: 2px;
        }

        .time-display {
            font-size: 11px;
            color: #666;
            letter-spacing: 1px;
            min-width: 50px;
        }

        .player-footer {
            background: #0a0a0a;
            padding: 8px 16px;
            border-top: 1px solid #222;
            text-align: right;
            font-size: 11px;
            color: #555;
        }

        @media (max-width: 600px) {
            .player-container {
                border-radius: 8px;
                border-width: 2px;
            }

            .player-header {
                padding: 10px 12px;
            }

            .live-text {
                font-size: 12px;
                letter-spacing: 1px;
            }

            .viewer-count {
                font-size: 10px;
            }

            .control-button {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <!-- Header with LIVE indicator and viewer count -->
        <div class="player-header">
            <div class="live-indicator">
                <div class="live-dot"></div>
                <div class="live-text">LIVE</div>
            </div>
            <div class="viewer-count" id="viewerCount">Loading...</div>
        </div>

        <!-- Video display area -->
        <div class="player-video">
            <img
                id="streamImage"
                class="video-image"
                src="https://picsum.photos/800/450?random=1"
                alt="Live Stream"
            >
        </div>

        <!-- Player controls (non-functional) -->
        <div class="player-controls">
            <div class="control-button">▶</div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="time-display">LIVE</div>
        </div>

        <!-- Footer -->
        <div class="player-footer">
            Infinite Live Stream™ — Zero Maintenance Broadcasting
        </div>
    </div>

    <script>
        /**
         * CONFIGURATION
         * Modify these settings to customize the stream appearance and behavior
         */

        // URL of the image to display (easily swappable)
        // Current: Random mundane image from picsum.photos
        // Examples of alternatives:
        // - https://via.placeholder.com/800x450/333333/555555
        // - https://images.unsplash.com/photo-1546484396-fb3fc6f95f98?w=800&h=450
        const STREAM_IMAGE_URL = 'https://picsum.photos/800/450?random=1';

        // Initial viewer count
        const INITIAL_VIEWERS = Math.floor(Math.random() * 8000) + 1000;

        // Range for random fluctuations (viewers per update)
        const FLUCTUATION_RANGE = { min: -150, max: 350 };

        // Interval for viewer count updates (milliseconds)
        const UPDATE_INTERVAL = 2000;

        /**
         * Viewer Counter System
         * Simulates realistic viewer fluctuations
         */
        class ViewerCounter {
            constructor(initialCount) {
                this.currentCount = initialCount;
                this.minCount = 100;
                this.maxCount = 50000;
                this.element = document.getElementById('viewerCount');
            }

            update() {
                // Generate random fluctuation
                const change = Math.floor(
                    Math.random() *
                    (FLUCTUATION_RANGE.max - FLUCTUATION_RANGE.min + 1) +
                    FLUCTUATION_RANGE.min
                );

                this.currentCount = Math.max(
                    this.minCount,
                    Math.min(this.maxCount, this.currentCount + change)
                );

                this.render();
            }

            render() {
                // Format viewer count with thousands separator
                const formatted = this.currentCount.toLocaleString();
                this.element.textContent = `${formatted} Viewer${this.currentCount !== 1 ? 's' : ''}`;
            }
        }

        // Initialize and start the viewer counter
        const viewerCounter = new ViewerCounter(INITIAL_VIEWERS);
        viewerCounter.render();

        // Update viewer count at regular intervals
        setInterval(() => {
            viewerCounter.update();
        }, UPDATE_INTERVAL);

        // Optional: Refresh the stream image periodically for extra realism
        // Comment out if you prefer the same image throughout
        // setInterval(() => {
        //     const img = document.getElementById('streamImage');
        //     img.src = STREAM_IMAGE_URL + '&t=' + Date.now();
        // }, 10000);
    </script>
</body>
</html>
